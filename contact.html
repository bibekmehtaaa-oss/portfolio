<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Bibek Mehta about a design or development project."
    />
    <title>Contact - Bibek Mehta</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap nav">
        <a class="brand" href="index.html"
          ><span class="brand-mark">m</span> Bibek Mehta</a
        ><button
          class="menu-button"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          +
        </button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a><a href="about.html">About</a
          ><a href="service.html">Services</a><a href="position.html">Work</a
          ><a class="nav-cta active" href="contact.html">Let's talk ↗</a>
        </nav>
      </div>
    </header>
    <main class="wrap contact-grid">
      <section>
        <div class="eyebrow hover">4.contact</div>
        <h2>Have a good one?</h2>
        <p class="contact-detail">
          Tell me what you’re working on, what’s stuck, or just say hello.
        </p>
        <p class="contact-detail">
          <a href="mailto:hello@minarowe.studio">hello@i'm Bibek.studio</a>
        </p>
        <p class="contact-detail">Amsterdam / CET</p>
      </section>
      <section class="contact-form">
        <form id="contact-form" class="form">
          <label
            >Name<input
              type="text"
              name="name"
              required
              placeholder="Your name" /></label
          ><label
            >Email<input
              type="email"
              name="email"
              required
              placeholder="you@company.com" /></label
          ><label
            >What are we making?<textarea
              name="message"
              required
              placeholder="A few words about your project..."
            ></textarea></label
          ><button class="button primary" type="submit">
            Send the note <span>↗</span>
          </button>
          <div class="form-status" role="status"></div>
        </form>
      </section>
    </main>
    <footer class="footer">
      <div class="wrap footer-inner">
        <span>© 2026 Bibek Mehta. Made with care.</span>
        <div class="socials">
          <a href="mailto:bibekmehtaaa@gmail.com">Email</a
          ><a href="https://www.linkedin.com/in/bibekmehta" target="_blank" rel="noreferrer"
            >LinkedIn ↗</a
          >
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
