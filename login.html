<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client login - Bibek Mehta</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap nav">
        <a class="brand" href="index.html"
          ><span class="brand-mark">m</span> Bibek Mehta</a
        ><a class="button ghost" href="index.html">Back home <span>↗</span></a>
      </div>
    </header>
    <main class="wrap login-wrap">
      <div class="eyebrow">Private client space</div>
      <h1>Welcome back.</h1>
      <form class="form">
        <label
          >Email<input
            type="email"
            required
            placeholder="you@company.com" /></label
        ><label
          >Password<input
            type="password"
            required
            placeholder="••••••••" /></label
        ><button class="button primary" type="submit">
          Log in <span>↗</span>
        </button>
      </form>
      <p class="contact-detail">
        Need an account? <a href="contact.html">Get in touch.</a>
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
